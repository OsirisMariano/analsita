services:
  api:
    build: ./backend
    container_name: analista_api
    volumes:
      - ./backend/app:/app/app
      - ./data:/var/abastece/dados
      - ./scripts:/scripts
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://api:8000
    container_name: analista_web
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita que o volume sobrescreva os pacotes instalados no container
    ports:
      - "5173:5173"
    depends_on:
      - api

networks:
  default:
    name: analista_network
