services:
  api:
    build: ./backend
    container_name: analista_api
    # Injeção de variáveis de ambiente (EQUIPAMENTOS, DB_PATH, segredos).
    # Copie backend/.env.example para backend/.env antes de usar.
    # required:false → se o .env não existir, o compose sobe mesmo assim (usa fallbacks do código).
    env_file:
      - path: backend/.env
        required: false
    # Permite sockets ICMP (ping) com o processo rodando como não-root
    cap_add:
      - NET_RAW
    volumes:
      # Código montado como somente-leitura (SEC-13): o container não pode
      # alterar o próprio código em runtime; /data permanece gravável (SQLite)
      - ./backend/app:/app/app:ro
      - ./data:/var/abastece/dados
      - ./scripts:/scripts:ro
      - ./mock_data/etc/abastece:/etc/abastece:ro
      - ./mock_data/etc/zabbix:/etc/zabbix:ro
      - ./mock_data/etc/logrotate.d:/etc/logrotate.d:ro
      - ./mock_data/var/abastece/SLT:/var/abastece/SLT:ro
      - ./mock_data/var/abastece/certificate:/var/abastece/certificate:ro
      - ./mock_data/home:/home:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://api:8000
    container_name: analista_web
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita que o volume sobrescreva os pacotes instalados no container
    ports:
      - "5173:5173"
    depends_on:
      - api

networks:
  default:
    name: analista_network
