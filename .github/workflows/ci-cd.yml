name: CI/CD Pipeline - Analista SemParar

# Dispara a pipeline em envios ou PRs direcionados à branch principal
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # --------------------------------------------------------
  # JOB 1: Testes e Linter do Backend (FastAPI / Python)
  # --------------------------------------------------------
  backend-ci:
    name: Backend CI (Python/FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do Backend
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install flake8 pytest

      - name: Verificar qualidade do código (Flake8)
        run: |
          # Checa erros de sintaxe ou imports não utilizados
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar Testes Automatizados (Pytest)
        run: |
          # Executa se houver a pasta de testes configurada no backend
          pytest backend/ -v || echo "Nenhum teste encontrado ainda, seguindo pipeline..."

  # --------------------------------------------------------
  # JOB 2: Build e Linter do Frontend (Vue 3 / Vite)
  # --------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Vue 3/Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Validar Build de Produção
        working-directory: ./frontend
        run: npm run build

  # --------------------------------------------------------
  # JOB 3: Validação do Docker Compose (Infraestrutura)
  # --------------------------------------------------------
  docker-build:
    name: Build das Imagens Docker
    needs: [backend-ci, frontend-ci] # Só executa se o backend e frontend passarem nos testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar Build do Docker Compose
        run: |
          docker compose build
